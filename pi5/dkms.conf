#
# DKMS packaging for snd-pio-tdm (ReSpeaker 6-Mic HAT data path on the Raspberry Pi 5).
#
# The driver is built against the in-kernel rp1-pio API, which is not a stable ABI, so the
# kernel you build against should be pinned with apt-mark hold.  DKMS is what makes that hold
# a safety belt rather than the only thing keeping the card alive: with AUTOINSTALL=yes,
# /etc/kernel/postinst.d/dkms rebuilds this module for every kernel apt installs.
#
#   sudo cp -a <this directory> /usr/src/snd-pio-tdm-1.0
#   sudo dkms add     -m snd-pio-tdm -v 1.0
#   sudo dkms build   -m snd-pio-tdm -v 1.0 -k "$(uname -r)"
#   sudo dkms install -m snd-pio-tdm -v 1.0 -k "$(uname -r)"
PACKAGE_NAME="snd-pio-tdm"
PACKAGE_VERSION="1.0"

# Invoke kbuild directly against the target kernel.  Do NOT use the Makefile's `all` target
# here: its KDIR default resolves from `uname -r`, i.e. the RUNNING kernel, which is the wrong
# one when DKMS is building for a kernel that was just installed.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="snd-pio-tdm"
# Advisory: Debian's DKMS overrides this and installs to /lib/modules/<kr>/updates/dkms,
# which depmod ranks above extra/ either way.  Check with `modinfo -n snd-pio-tdm`.
DEST_MODULE_LOCATION[0]="/extra"

AUTOINSTALL="yes"
